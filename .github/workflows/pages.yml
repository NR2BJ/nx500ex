# web/ 폴더 (nx500ex LUT 변환기, 정적 페이지) 를 GitHub Pages 로 배포한다. 서버 코드 없음.
name: pages
on:
  push:
    branches: [claude/dazzling-thompson-hikteq]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
